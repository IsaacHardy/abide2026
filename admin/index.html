<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ABIDE 2026 — Speaker Admin</title>
  <style>
    :root {
      --ink: #2b2b2b;
      --muted: #6b6b6b;
      --line: #e7e3da;
      --bg: #faf7f0;
      --accent: #f26ba4;
      --accent-ink: #fff;
      --ok: #3f9d6b;
      --err: #d8553f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      background: #fff; border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    header h1 { font-size: 17px; margin: 0; }
    header .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 120px; }
    .note {
      background: #fff6e9; border: 1px solid #f3dcb8; color: #8a5a1a;
      border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 18px;
    }
    .card {
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      padding: 16px; margin-bottom: 16px;
      display: grid; grid-template-columns: 180px 1fr; gap: 18px;
    }
    @media (max-width: 620px) { .card { grid-template-columns: 1fr; } }
    .card.invalid { border-color: var(--err); box-shadow: 0 0 0 2px rgba(216,85,63,.15); }

    /* Live preview (approximates the live site card) */
    .preview { align-self: start; }
    .pv-card { border-radius: 16px; padding: 8px; }
    .pv-photo {
      aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; background: #eee;
    }
    .pv-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pv-pillwrap { text-align: center; margin-top: -16px; }
    .pv-pill {
      display: inline-block; padding: 6px 16px; border-radius: 999px;
      font-weight: 700; font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }
    .pv-empty { display:flex; align-items:center; justify-content:center; height:100%; color:#aaa; font-size:12px; text-align:center; padding:8px; }

    .fields { display: grid; gap: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    input[type=text], textarea, select {
      width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px;
      font: inherit; font-size: 14px; background: #fff; color: var(--ink);
    }
    textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }

    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatch {
      width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
      border: 2px solid rgba(0,0,0,.08); padding: 0; position: relative;
    }
    .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); border-color: #fff; }
    .swatch-label { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }

    .photo-row { display: flex; align-items: center; gap: 12px; }
    .photo-thumb { width: 52px; height: 64px; border-radius: 8px; object-fit: cover; background:#eee; border:1px solid var(--line); }
    .filename { font-size: 12px; color: var(--muted); word-break: break-all; }

    .card-actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 12px; }
    button {
      font: inherit; font-size: 14px; cursor: pointer; border-radius: 9px;
      border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 8px 12px;
    }
    button:hover { background: #f4f1ea; }
    button.icon { padding: 8px 10px; }
    button.danger { color: var(--err); border-color: #efc9c0; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
    .btn-primary:hover { filter: brightness(.96); background: var(--accent); }

    .add { width: 100%; padding: 14px; border-style: dashed; font-weight: 600; color: var(--muted); }

    .savebar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      background: #fff; border-top: 1px solid var(--line);
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .savebar .status { font-size: 13px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .savebar .right { display: flex; align-items: center; gap: 12px; }
    .savebar .btn-primary { padding: 11px 22px; }
    .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(0,0,0,.2); border-top-color: var(--ink); border-radius:50%; animation: spin .7s linear infinite; vertical-align:-2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .center-msg { text-align:center; color: var(--muted); padding: 60px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>ABIDE 2026 — Speaker Admin</h1>
      <div class="sub">Edit the speakers shown on abide2026.com</div>
    </div>
  </header>

  <div class="wrap">
    <div class="note">
      Changes go live on the website within about <strong>5 minutes</strong> of saving.
      Upload a photo by clicking <strong>Upload photo</strong> on a speaker. Don’t forget to press <strong>Save changes</strong>.
    </div>

    <div id="list"></div>

    <button id="add" class="add">＋ Add a speaker</button>
  </div>

  <div class="savebar">
    <span id="status" class="status"></span>
    <div class="right">
      <button id="reload">Discard &amp; reload</button>
      <button id="save" class="btn-primary" disabled>Save changes</button>
    </div>
  </div>

  <script>
    var MEDIA_HOST = 'https://media.abide2026.com';
    var BRAND = [
      { hex: '#e0dd90', name: 'Yellow-green' },
      { hex: '#b7ceca', name: 'Sage' },
      { hex: '#ff8d53', name: 'Coral' },
      { hex: '#f26ba4', name: 'Hot pink' },
      { hex: '#fde6d3', name: 'Peach' },
      { hex: '#f0a398', name: 'Rose' }
    ];
    var FOCUS_OPTIONS = [
      { label: 'Centered', value: 'center center' },
      { label: 'Face near top', value: 'center top' },
      { label: 'Slightly high (20%)', value: 'center 20%' },
      { label: 'Slightly high (25%)', value: 'center 25%' },
      { label: 'High (10%)', value: 'center 10%' }
    ];
    var DEFAULTS = { cardBg: '#e0dd90', pillBg: '#fde6d3', pillText: '#f26ba4', focus: 'center 20%' };

    var speakers = [];
    var dirty = false;

    var listEl = document.getElementById('list');
    var statusEl = document.getElementById('status');
    var saveBtn = document.getElementById('save');
    var addBtn = document.getElementById('add');
    var reloadBtn = document.getElementById('reload');

    function imgUrl(filename) {
      if (!filename) return '';
      if (/^https?:\/\//i.test(filename)) return filename;
      return MEDIA_HOST + '/' + String(filename).replace(/^\/+/, '');
    }
    function setDirty(v) {
      dirty = v;
      saveBtn.disabled = !v;
      if (v) setStatus('', '');
    }
    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    function makeSwatchRow(labelText, key, sp, onChange) {
      var wrap = document.createElement('div');
      var lab = document.createElement('div');
      lab.className = 'swatch-label';
      lab.textContent = labelText;
      wrap.appendChild(lab);
      var row = document.createElement('div');
      row.className = 'swatches';
      BRAND.forEach(function (c) {
        var b = document.createElement('button');
        b.className = 'swatch';
        b.style.background = c.hex;
        b.title = c.name;
        b.setAttribute('aria-pressed', String((sp[key] || '').toLowerCase() === c.hex));
        b.addEventListener('click', function () {
          sp[key] = c.hex;
          row.querySelectorAll('.swatch').forEach(function (s) { s.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
          onChange();
          setDirty(true);
        });
        row.appendChild(b);
      });
      wrap.appendChild(row);
      return wrap;
    }

    function renderPreview(container, sp) {
      var bg = sp.cardBg || DEFAULTS.cardBg;
      var pillBg = sp.pillBg || DEFAULTS.pillBg;
      var pillText = sp.pillText || DEFAULTS.pillText;
      var url = imgUrl(sp.img);
      container.innerHTML =
        '<div class="pv-card" style="background:' + bg + '">' +
          '<div class="pv-photo">' +
            (url
              ? '<img src="' + url + '" alt="" style="object-position:' + (sp.focus || DEFAULTS.focus) + '">'
              : '<div class="pv-empty">No photo yet</div>') +
          '</div>' +
          '<div class="pv-pillwrap"><span class="pv-pill" style="background:' + pillBg + ';color:' + pillText + '">' +
            (sp.name ? escapeHtml(sp.name) : 'Name') +
          '</span></div>' +
        '</div>';
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function renderAll() {
      listEl.innerHTML = '';
      if (!speakers.length) {
        var empty = document.createElement('div');
        empty.className = 'center-msg';
        empty.textContent = 'No speakers yet. Click “Add a speaker” below.';
        listEl.appendChild(empty);
        return;
      }
      speakers.forEach(function (sp, i) { listEl.appendChild(renderCard(sp, i)); });
    }

    function renderCard(sp, index) {
      var card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = index;

      // Preview column
      var prev = document.createElement('div');
      prev.className = 'preview';
      renderPreview(prev, sp);
      card.appendChild(prev);
      function refreshPreview() { renderPreview(prev, sp); }

      // Fields column
      var fields = document.createElement('div');
      fields.className = 'fields';

      // Name
      fields.appendChild(field('Name', textInput(sp.name || '', function (v) {
        sp.name = v; refreshPreview(); setDirty(true);
      })));

      // Bio
      var bio = document.createElement('textarea');
      bio.value = sp.bio || '';
      bio.addEventListener('input', function () { sp.bio = bio.value; setDirty(true); });
      fields.appendChild(field('Bio', bio));

      // Alt + Focus row
      var alt = textInput(sp.alt || '', function (v) { sp.alt = v; setDirty(true); });
      alt.placeholder = 'Defaults to the name if left blank';
      var focus = document.createElement('select');
      FOCUS_OPTIONS.forEach(function (o) {
        var opt = document.createElement('option');
        opt.value = o.value; opt.textContent = o.label;
        if ((sp.focus || DEFAULTS.focus) === o.value) opt.selected = true;
        focus.appendChild(opt);
      });
      focus.addEventListener('change', function () { sp.focus = focus.value; refreshPreview(); setDirty(true); });
      var row2 = document.createElement('div');
      row2.className = 'row2';
      row2.appendChild(field('Alt text (for screen readers)', alt));
      row2.appendChild(field('Photo position', focus));
      fields.appendChild(row2);

      // Photo
      fields.appendChild(field('Photo', photoControl(sp, refreshPreview)));

      // Colors
      fields.appendChild(makeSwatchRow('Card color', 'cardBg', sp, refreshPreview));
      fields.appendChild(makeSwatchRow('Pill color', 'pillBg', sp, refreshPreview));
      fields.appendChild(makeSwatchRow('Name text color', 'pillText', sp, refreshPreview));

      card.appendChild(fields);

      // Actions
      var actions = document.createElement('div');
      actions.className = 'card-actions';
      var up = iconBtn('▲ Up', function () { move(index, -1); });
      up.disabled = index === 0;
      var down = iconBtn('▼ Down', function () { move(index, 1); });
      down.disabled = index === speakers.length - 1;
      var del = iconBtn('🗑 Remove', function () {
        if (confirm('Remove ' + (sp.name || 'this speaker') + '?')) {
          speakers.splice(index, 1); setDirty(true); renderAll();
        }
      });
      del.className = 'icon danger';
      actions.appendChild(up); actions.appendChild(down); actions.appendChild(del);
      card.appendChild(actions);

      return card;
    }

    function field(labelText, control) {
      var w = document.createElement('div');
      var l = document.createElement('label');
      l.textContent = labelText;
      w.appendChild(l); w.appendChild(control);
      return w;
    }
    function textInput(val, onInput) {
      var i = document.createElement('input');
      i.type = 'text'; i.value = val;
      i.addEventListener('input', function () { onInput(i.value); });
      return i;
    }
    function iconBtn(text, onClick) {
      var b = document.createElement('button');
      b.className = 'icon'; b.textContent = text;
      b.addEventListener('click', onClick);
      return b;
    }

    function photoControl(sp, refreshPreview) {
      var wrap = document.createElement('div');
      wrap.className = 'photo-row';
      var thumb = document.createElement('img');
      thumb.className = 'photo-thumb';
      if (sp.img) thumb.src = imgUrl(sp.img);
      var col = document.createElement('div');
      var btn = document.createElement('button');
      btn.textContent = 'Upload photo';
      var fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/webp,image/png,image/jpeg,image/avif';
      fileInput.className = 'hidden';
      var fname = document.createElement('div');
      fname.className = 'filename';
      fname.textContent = sp.img || 'No photo yet';

      btn.addEventListener('click', function () { fileInput.click(); });
      fileInput.addEventListener('change', function () {
        var f = fileInput.files && fileInput.files[0];
        if (!f) return;
        btn.disabled = true; btn.textContent = 'Uploading…';
        var fd = new FormData();
        fd.append('file', f);
        fd.append('name', sp.name || '');
        fetch('/api/upload', { method: 'POST', body: fd })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            if (!res.ok) throw new Error(res.j && res.j.error ? res.j.error : 'Upload failed');
            sp.img = res.j.filename;
            thumb.src = imgUrl(sp.img) + '?t=' + Date.now();
            fname.textContent = sp.img;
            refreshPreview(); setDirty(true);
          })
          .catch(function (e) { alert(e.message || 'Upload failed'); })
          .then(function () { btn.disabled = false; btn.textContent = 'Upload photo'; fileInput.value = ''; });
      });

      col.appendChild(btn); col.appendChild(fname); col.appendChild(fileInput);
      wrap.appendChild(thumb); wrap.appendChild(col);
      return wrap;
    }

    function move(index, delta) {
      var j = index + delta;
      if (j < 0 || j >= speakers.length) return;
      var tmp = speakers[index]; speakers[index] = speakers[j]; speakers[j] = tmp;
      setDirty(true); renderAll();
    }

    addBtn.addEventListener('click', function () {
      speakers.push({ name: '', bio: '', img: '', alt: '', focus: DEFAULTS.focus,
        cardBg: DEFAULTS.cardBg, pillBg: DEFAULTS.pillBg, pillText: DEFAULTS.pillText });
      setDirty(true); renderAll();
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    });

    function firstInvalid() {
      for (var i = 0; i < speakers.length; i++) {
        var s = speakers[i];
        if (!s.name || !s.name.trim()) return { i: i, why: 'needs a name' };
        if (!s.bio || !s.bio.trim()) return { i: i, why: 'needs a bio' };
        if (!s.img || !s.img.trim()) return { i: i, why: 'needs a photo' };
      }
      return null;
    }

    saveBtn.addEventListener('click', function () {
      document.querySelectorAll('.card.invalid').forEach(function (c) { c.classList.remove('invalid'); });
      var bad = firstInvalid();
      if (bad) {
        var cardEl = listEl.querySelector('.card[data-index="' + bad.i + '"]');
        if (cardEl) { cardEl.classList.add('invalid'); cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        setStatus('Speaker ' + (bad.i + 1) + ' ' + bad.why + '.', 'err');
        return;
      }
      // Normalize: blank alt -> name
      var payload = speakers.map(function (s) {
        return { name: s.name.trim(), bio: s.bio.trim(), img: s.img.trim(),
          alt: (s.alt && s.alt.trim()) || s.name.trim(),
          focus: s.focus || DEFAULTS.focus,
          cardBg: s.cardBg || DEFAULTS.cardBg, pillBg: s.pillBg || DEFAULTS.pillBg, pillText: s.pillText || DEFAULTS.pillText };
      });
      saveBtn.disabled = true;
      setStatus('Saving…', '');
      statusEl.innerHTML = '<span class="spinner"></span> Saving…';
      fetch('/api/speakers', {
        method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload)
      })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.j && res.j.error ? res.j.error : 'Save failed');
          setStatus('Saved ✓  Live on the site within ~5 minutes.', 'ok');
          dirty = false; saveBtn.disabled = true;
        })
        .catch(function (e) { setStatus(e.message || 'Save failed', 'err'); saveBtn.disabled = false; });
    });

    function load() {
      setStatus('Loading…', '');
      listEl.innerHTML = '<div class="center-msg">Loading speakers…</div>';
      fetch('/api/speakers', { headers: { accept: 'application/json' } })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.j && res.j.error ? res.j.error : 'Could not load');
          speakers = Array.isArray(res.j) ? res.j : [];
          setStatus('', ''); setDirty(false); renderAll();
        })
        .catch(function (e) {
          listEl.innerHTML = '<div class="center-msg">Could not load speakers. ' + escapeHtml(e.message || '') + '</div>';
        });
    }

    reloadBtn.addEventListener('click', function () {
      if (dirty && !confirm('Discard unsaved changes and reload?')) return;
      load();
    });

    window.addEventListener('beforeunload', function (e) {
      if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    load();
  </script>
</body>
</html>
